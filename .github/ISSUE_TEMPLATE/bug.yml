name: Bug report
description: Report an action or platform issue
body:
  - type: textarea
    attributes:
      label: App version, OS and architecture
    validations:
      required: true
  - type: textarea
    attributes:
      label: Action ID and reproduction steps (remove private data)
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
