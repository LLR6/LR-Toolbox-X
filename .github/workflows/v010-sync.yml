name: Sync v0.10 visual studio dependencies

on:
  push:
    branches: [feature/v0.10-visual-tool-studios]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[v010-deps]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v0.10-visual-tool-studios
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned visual studio dependencies
        run: |
          npm install --save-exact mermaid@12.2.0 @stackline/xlsx@1.0.9 svgo@4.1.0 exifreader@4.51.0 heic2any@0.0.4 colorthief@3.5.0 html2canvas@1.4.1 cron-parser@5.10.2 @zxcvbn-ts/core@4.2.0 @zxcvbn-ts/language-common@4.1.3 dayjs@1.11.23
          npm version 0.10.0 --no-git-tag-version --allow-same-version
      - name: Sync discovery copy and studio count
        run: |
          python - <<'PY'
          from pathlib import Path
          main = Path("apps/web/src/main.tsx")
          text = main.read_text()
          text = text.replace("v0.8.0 ·", "v0.10.0 ·")
          text = text.replace("七个有介绍、有预览的完整工作台。", "一组有介绍、有预览、按任务设计的特色工作台。")
          text = text.replace("Seven guided workspaces with real previews.", "A growing set of guided workspaces with real previews.")
          main.write_text(text)
          creative = Path("tests/e2e/creative.spec.ts")
          text = creative.read_text()
          text = text.replace("discovery introduces seven studios and recommends only three tools at a time", "discovery exposes seventeen studios and recommends only three tools at a time")
          text = text.replace('await expect(page.locator(".studio-card")).toHaveCount(7);', 'await expect(page.locator(".studio-card")).toHaveCount(17);')
          creative.write_text(text)
          PY
      - name: Validate install
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm run typecheck
      - name: Commit deterministic v0.10 sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/web/src/main.tsx tests/e2e/creative.spec.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: sync v0.10 dependencies and discovery [v010-deps]"
          git push origin HEAD:feature/v0.10-visual-tool-studios
