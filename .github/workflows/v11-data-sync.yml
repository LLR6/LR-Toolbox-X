name: Sync v0.11 data utility studios

on:
  push:
    branches: [feature/v0.11-data-utility-studios]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[v11-data-sync]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v0.11-data-utility-studios
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned engines
        run: |
          npm install --save-exact sql.js@1.15.1 jsondiffpatch@0.7.6 libphonenumber-js@1.13.15 chrono-node@2.10.1
          npm install --save-dev --save-exact @types/sql.js@1.4.11
      - name: Register four data utility studios
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/web/src/studios.ts")
          text = path.read_text()
          text = text.replace('  | "barcode";','  | "barcode"\n  | "sqlite"\n  | "jsondiff"\n  | "phone"\n  | "chrono";')
          marker = 'export type PowerStudioId = Extract<\n'
          block = '''export type DataUtilityStudioId = Extract<\n  StudioId,\n  "sqlite" | "jsondiff" | "phone" | "chrono"\n>;\n\n'''
          if block not in text:
              text = text.replace(marker, block + marker)
          text = text.replace('  | PowerStudioId\n>;', '  | PowerStudioId\n  | DataUtilityStudioId\n>;')
          text = text.replace('  VisualStudioId | PowerStudioId | "sql"\n>;', '  VisualStudioId | PowerStudioId | DataUtilityStudioId | "sql"\n>;')
          anchor = 'export const powerStudioIds: PowerStudioId[] = ['
          data_ids = '''export const dataUtilityStudioIds: DataUtilityStudioId[] = [\n  "sqlite",\n  "jsondiff",\n  "phone",\n  "chrono",\n];\n\n'''
          if data_ids not in text:
              text = text.replace(anchor, data_ids + anchor)
          predicate_anchor = 'export const isPowerStudio = (id: StudioId): id is PowerStudioId =>\n  powerStudioIds.includes(id as PowerStudioId);\n'
          predicate = predicate_anchor + 'export const isDataUtilityStudio = (id: StudioId): id is DataUtilityStudioId =>\n  dataUtilityStudioIds.includes(id as DataUtilityStudioId);\n'
          text = text.replace(predicate_anchor, predicate)
          entries = '''  {\n    id: "sqlite",\n    name: "SQLite 数据库工作台",\n    en: "SQLite Database Studio",\n    category: "Code",\n    intro: "直接在浏览器里建库、跑 SQL、查看结果并导出真实数据库。",\n    introEn: "Build, query and export a real SQLite database entirely in your browser.",\n    use: "建表 · 查询 · 聚合 · SQLite 文件导出",\n    useEn: "DDL · Queries · Aggregates · SQLite export",\n    engine: "sql.js",\n    repo: "https://github.com/sql-js/sql.js",\n    accent: "mint",\n  },\n  {\n    id: "jsondiff",\n    name: "JSON 差异与补丁",\n    en: "JSON Diff & Patch",\n    category: "Code",\n    intro: "不只看哪里变了，还能生成补丁并验证应用后的对象。",\n    introEn: "See structural changes, generate a delta and verify the patched object.",\n    use: "深层 Diff · 数组变更 · Delta · Patch 验证",\n    useEn: "Deep diff · Arrays · Delta · Patch verification",\n    engine: "jsondiffpatch",\n    repo: "https://github.com/benjamine/jsondiffpatch",\n    accent: "coral",\n  },\n  {\n    id: "phone",\n    name: "国际手机号解析台",\n    en: "International Phone Inspector",\n    category: "Text",\n    intro: "把各种写法的号码标准化，并检查国家、类型与有效性。",\n    introEn: "Normalize phone numbers and inspect country, type and validity.",\n    use: "E.164 · 国际格式 · 国家识别 · 类型 · 有效性",\n    useEn: "E.164 · International format · Country · Type · Validity",\n    engine: "libphonenumber-js",\n    repo: "https://github.com/catamphetamine/libphonenumber-js",\n    accent: "blue",\n  },\n  {\n    id: "chrono",\n    name: "自然语言时间解析",\n    en: "Natural Language Date Parser",\n    category: "Time",\n    intro: "把“下周五下午三点”这类文字直接识别成真实时间。",\n    introEn: "Turn phrases like “next Friday at 3pm” into actual timestamps.",\n    use: "中文 / English · 相对日期 · 时间范围 · ISO 时间线",\n    useEn: "Chinese / English · Relative dates · Ranges · ISO timeline",\n    engine: "chrono-node",\n    repo: "https://github.com/wanasit/chrono",\n    accent: "violet",\n  },\n'''
          if 'id: "sqlite"' not in text:
              text = text.replace('];\n\nexport const studioMatches', entries + '];\n\nexport const studioMatches')
          path.write_text(text)
          PY
      - name: Append third-party notices
        run: |
          cat >> THIRD_PARTY_NOTICES.md <<'EOF'

## v0.11 data utility studios

- `sql.js` 1.15.1 — MIT; SQLite compiled to WebAssembly for local in-browser databases. https://github.com/sql-js/sql.js
- `jsondiffpatch` 0.7.6 — MIT; structural JSON diff and patch engine. https://github.com/benjamine/jsondiffpatch
- `libphonenumber-js` 1.13.15 — MIT; international phone-number parsing and validation. https://github.com/catamphetamine/libphonenumber-js
- `chrono-node` 2.10.1 — MIT; natural-language date and time parsing. https://github.com/wanasit/chrono
- `@types/sql.js` 1.4.11 — MIT; development-only TypeScript declarations from DefinitelyTyped.
EOF
      - name: Validate implementation
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm audit --omit=dev --audit-level=moderate
      - name: Commit deterministic dependency and registry changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/web/src/studios.ts THIRD_PARTY_NOTICES.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: sync v0.11 data utility engines [v11-data-sync]"
          git push origin HEAD:feature/v0.11-data-utility-studios
