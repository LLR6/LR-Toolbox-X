name: Harden v0.11 barcode studio

on:
  push:
    branches:
      - feature/v0.11-power-studios

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[barcode-fix]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v0.11-power-studios
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Apply deterministic barcode patch
        run: node scripts/fix-v011-barcode.mjs
      - name: Validate barcode and static checks
        run: |
          npm run lint
          npm run typecheck
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/power-studios.spec.ts --grep "barcode studio"
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/PowerStudioWorkspace.tsx
          git commit -m "fix: harden barcode generation and decoding [barcode-fix]"
          git push origin HEAD:feature/v0.11-power-studios
