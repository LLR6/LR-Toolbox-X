name: Harden v0.11 barcode studio

on:
  push:
    branches:
      - feature/v0.11-power-studios

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[barcode-fix]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v0.11-power-studios
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Improve barcode quiet zone and resilient image decoding
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/web/src/PowerStudioWorkspace.tsx")
          text = path.read_text()
          old_options = '''        scale: 3,
        height: barcodeType === "qrcode" || barcodeType === "datamatrix" ? 28 : 14,
        includetext: barcodeType !== "qrcode" && barcodeType !== "datamatrix",
        textxalign: "center",
        backgroundcolor: "FFFFFF",
'''
          new_options = '''        scale: 4,
        height: barcodeType === "qrcode" || barcodeType === "datamatrix" ? 28 : 16,
        includetext: barcodeType !== "qrcode" && barcodeType !== "datamatrix",
        textxalign: "center",
        paddingwidth: barcodeType === "qrcode" || barcodeType === "datamatrix" ? 4 : 12,
        paddingheight: 6,
        backgroundcolor: "FFFFFF",
'''
          if old_options not in text:
              raise SystemExit("barcode render options anchor not found")
          text = text.replace(old_options, new_options, 1)
          old_scan = '''      const { BrowserMultiFormatReader } = await import("@zxing/browser");
      const reader = new BrowserMultiFormatReader();
      const url = URL.createObjectURL(file);
      try {
        const result = await reader.decodeFromImageUrl(url);
        setScanResult(result.getText());
        setNotice(t("识别完成。", "Barcode decoded."));
      } finally {
        URL.revokeObjectURL(url);
      }
'''
          new_scan = '''      const { BrowserMultiFormatReader } = await import("@zxing/browser");
      const reader = new BrowserMultiFormatReader();
      const url = URL.createObjectURL(file);
      try {
        try {
          const result = await reader.decodeFromImageUrl(url);
          setScanResult(result.getText());
        } catch (firstError) {
          const bitmap = await createImageBitmap(file);
          try {
            const scale = Math.max(2, Math.min(4, Math.ceil(1200 / Math.max(bitmap.width, bitmap.height))));
            const quiet = 48;
            const canvas = document.createElement("canvas");
            canvas.width = bitmap.width * scale + quiet * 2;
            canvas.height = bitmap.height * scale + quiet * 2;
            const context = canvas.getContext("2d", { willReadFrequently: true });
            if (!context) throw firstError;
            context.imageSmoothingEnabled = false;
            context.fillStyle = "#ffffff";
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(bitmap, quiet, quiet, bitmap.width * scale, bitmap.height * scale);
            const result = reader.decodeFromCanvas(canvas);
            setScanResult(result.getText());
          } finally {
            bitmap.close();
          }
        }
        setNotice(t("识别完成。", "Barcode decoded."));
      } finally {
        URL.revokeObjectURL(url);
      }
'''
          if old_scan not in text:
              raise SystemExit("barcode scanner anchor not found")
          path.write_text(text.replace(old_scan, new_scan, 1))
          PY
      - name: Validate barcode and static checks
        run: |
          npm run lint
          npm run typecheck
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/power-studios.spec.ts --grep "barcode studio"
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/PowerStudioWorkspace.tsx
          git commit -m "fix: harden barcode generation and decoding [barcode-fix]"
          git push origin HEAD:feature/v0.11-power-studios
