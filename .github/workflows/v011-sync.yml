name: Sync v0.11 power studios

on:
  push:
    branches:
      - feature/v0.11-data-dev-studios

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v0.11-data-dev-studios
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Stop after generated sync commit
        if: contains(github.event.head_commit.message, '[v011-sync]')
        run: echo "already synced"
      - name: Install pinned engines
        if: ${{ !contains(github.event.head_commit.message, '[v011-sync]') }}
        run: npm install --save-exact echarts@6.1.0 mathjs@15.2.0 jsbarcode@3.12.3 jose@6.2.13 jsonata@2.2.2 handlebars@4.7.10 reveal.js@6.0.2 sql.js@1.15.1
      - name: Wire studios
        if: ${{ !contains(github.event.head_commit.message, '[v011-sync]') }}
        run: |
          python scripts/v011-sync.py
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/web/src/PowerStudioWorkspace.tsx")
          text = path.read_text()
          text = text.replace(
            '    const bytes = sqlDb.current.export();\n    downloadBlob("lr-toolbox.sqlite", new Blob([bytes], { type: "application/vnd.sqlite3" }));',
            '    const bytes = sqlDb.current.export();\n    const copy = new Uint8Array(bytes);\n    downloadBlob("lr-toolbox.sqlite", new Blob([copy.buffer], { type: "application/vnd.sqlite3" }));',
          )
          path.write_text(text)
          notices = Path("THIRD_PARTY_NOTICES.md")
          notices.write_text(notices.read_text().replace('`handlebars` 4.7.9', '`handlebars` 4.7.10'))
          PY
      - name: Validate implementation
        if: ${{ !contains(github.event.head_commit.message, '[v011-sync]') }}
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm run lint
          npm run typecheck
          npm run build
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Commit deterministic changes
        if: ${{ !contains(github.event.head_commit.message, '[v011-sync]') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json THIRD_PARTY_NOTICES.md apps/web/src/studios.ts apps/web/src/StudioWorkspace.tsx apps/web/src/PowerStudioWorkspace.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: wire v0.11 power studios [v011-sync]"
          git push origin HEAD:feature/v0.11-data-dev-studios
