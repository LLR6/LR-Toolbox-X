name: Validate v0.11 power studios

on:
  push:
    branches:
      - feature/v0.11-power-studios

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[v011-sync]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v0.11-power-studios
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Resolve pinned dependencies
        run: npm install --ignore-scripts
      - name: Apply browser-safe compatibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/web/src/PowerStudioWorkspace.tsx")
          text = path.read_text()
          text = text.replace(
              'const { quicktype, InputData, jsonInputForTargetLanguage } = await import("quicktype-core");\n      const jsonInput = jsonInputForTargetLanguage(targetLanguage);',
              'const { quicktype, InputData, jsonInputForTargetLanguage, isLanguageName } = await import("quicktype-core");\n      if (!isLanguageName(targetLanguage)) throw Error(t("不支持这个目标语言。", "Unsupported target language."));\n      const jsonInput = jsonInputForTargetLanguage(targetLanguage);',
          )
          text = text.replace(
              'const module = await import("lottie-web");',
              'const module = await import("lottie-web/build/player/lottie_light.js");',
          )
          path.write_text(text)

          creative = Path("tests/e2e/creative.spec.ts")
          c = creative.read_text().replace("discovery exposes seventeen studios", "discovery exposes twenty-three studios").replace('toHaveCount(17)', 'toHaveCount(23)')
          creative.write_text(c)
          PY
      - name: Static and security checks
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm audit --omit=dev --audit-level=moderate
      - name: Browser integration suite
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Commit lockfile and compatibility sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json tests/e2e/creative.spec.ts apps/web/src/PowerStudioWorkspace.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: lock v0.11 power studios [v011-sync]"
          git push origin HEAD:feature/v0.11-power-studios
