name: Apply v0.10 world clock fix

on:
  push:
    branches: [feature/v0.10-visual-tool-studios]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[v010-zone]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v0.10-visual-tool-studios
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Keep five distinct world clocks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('apps/web/src/VisualStudioWorkspace.tsx')
          text = path.read_text()
          pattern = re.compile(r'''  const worldZones = \[localZone, "UTC", "Asia/Shanghai", "America/Los_Angeles", "Europe/London"\]\.filter\(\s*\n\s*\(value, index, list\) => list\.indexOf\(value\) === index,\s*\n\s*\);''')
          new = '''  const worldZones = [
            ...new Set([
              localZone,
              "UTC",
              "Asia/Shanghai",
              "America/Los_Angeles",
              "Europe/London",
              "Asia/Tokyo",
              "Australia/Sydney",
            ]),
          ].slice(0, 5);'''
          text, count = pattern.subn(new, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one worldZones block, found {count}')
          path.write_text(text)
          PY
          npm run lint
          npm run typecheck
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/VisualStudioWorkspace.tsx
          git commit -m "fix: keep five distinct world clocks [v010-zone]"
          git push origin HEAD:feature/v0.10-visual-tool-studios
