name: Apply final v0.10 browser fixes

on:
  push:
    branches: [feature/v0.10-visual-tool-studios]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[v010-final]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v0.10-visual-tool-studios
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Apply preview hardening and E2E fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/VisualStudioWorkspace.tsx')
          text = path.read_text()

          old = '''function useBlobUrl(blob: Blob | undefined) {
            const [url, setUrl] = useState("");
            useEffect(() => {
              if (!blob) {
                setUrl("");
                return;
              }
              const next = URL.createObjectURL(blob);
              setUrl(next);
              return () => URL.revokeObjectURL(next);
            }, [blob]);
            return url;
          }

          '''
          new = '''function RasterPreview({ blob, label }: { blob: Blob; label: string }) {
            const ref = useRef<HTMLCanvasElement>(null);
            const [failed, setFailed] = useState(false);
            useEffect(() => {
              let active = true;
              let bitmap: ImageBitmap | undefined;
              setFailed(false);
              void createImageBitmap(blob)
                .then((next) => {
                  if (!active) {
                    next.close();
                    return;
                  }
                  bitmap = next;
                  const canvas = ref.current;
                  if (!canvas) return;
                  const scale = Math.min(1, 1200 / next.width, 900 / next.height);
                  canvas.width = Math.max(1, Math.round(next.width * scale));
                  canvas.height = Math.max(1, Math.round(next.height * scale));
                  const context = canvas.getContext("2d");
                  if (!context) throw Error("Canvas unavailable");
                  context.drawImage(next, 0, 0, canvas.width, canvas.height);
                })
                .catch(() => {
                  if (active) setFailed(true);
                });
              return () => {
                active = false;
                bitmap?.close();
              };
            }, [blob]);
            return failed ? (
              <div className="raster-preview-fallback">{label}</div>
            ) : (
              <canvas ref={ref} role="img" aria-label={label} />
            );
          }

          '''
          if old not in text: raise SystemExit('useBlobUrl block not found')
          text = text.replace(old, new)
          text = text.replace('''  const [photoFile, setPhotoFile] = useState<File | null>(null);
            const photoUrl = useBlobUrl(photoFile ?? undefined);
            const [exif, setExif] = useState<ExifSummary>({});''', '''  const [photoFile, setPhotoFile] = useState<File | null>(null);
            const [exif, setExif] = useState<ExifSummary>({});''')
          text = text.replace('''  const [heicOutputs, setHeicOutputs] = useState<Blob[]>([]);
            const heicUrl = useBlobUrl(heicOutputs[0]);

            const [paletteFile, setPaletteFile] = useState<File | null>(null);
            const paletteUrl = useBlobUrl(paletteFile ?? undefined);''', '''  const [heicOutputs, setHeicOutputs] = useState<Blob[]>([]);

            const [paletteFile, setPaletteFile] = useState<File | null>(null);''')
          text = text.replace('''      if (file.size > 15000000) throw Error(t("照片最大 15 MB", "Photo limit is 15 MB"));
                const { default: ExifReader } = await import("exifreader");''', '''      if (file.size > 15000000) throw Error(t("照片最大 15 MB", "Photo limit is 15 MB"));
                const allowed = new Set(["image/jpeg", "image/png", "image/webp", "image/avif", "image/heic", "image/heif"]);
                const extensionAllowed = /\\.(jpe?g|png|webp|avif|heic|heif)$/i.test(file.name);
                if (!allowed.has(file.type.toLowerCase()) && !extensionAllowed)
                  throw Error(t("请选择 JPEG、PNG、WebP、AVIF、HEIC 或 HEIF 照片", "Choose JPEG, PNG, WebP, AVIF, HEIC or HEIF"));
                const { default: ExifReader } = await import("exifreader");''')
          text = text.replace('''svg{max-width:94%;max-height:94vh}''', '''svg{display:block;width:min(94%,960px);height:auto;max-height:94vh}''')
          text = text.replace('''{photoUrl && <img src={photoUrl} alt={t("照片预览", "Photo preview")} />}''', '''{photoFile && <RasterPreview blob={photoFile} label={t("照片预览", "Photo preview")} />}''')
          text = text.replace('''{heicUrl ? <><img src={heicUrl} alt="HEIC converted preview" /><div className="visual-actions">''', '''{heicOutputs[0] ? <><RasterPreview blob={heicOutputs[0]} label="HEIC converted preview" /><div className="visual-actions">''')
          text = text.replace('''{paletteUrl && <img src={paletteUrl} alt={t("配色参考图", "Palette source")} />}''', '''{paletteFile && <RasterPreview blob={paletteFile} label={t("配色参考图", "Palette source")} />}''')
          text = text.replace('''<button className="studio-primary" disabled={busy} onClick={() => void calculateTime()}>{t("计算", "Calculate")} →</button>''', '''<button className="studio-primary" aria-label={t("计算", "Calculate")} disabled={busy} onClick={() => void calculateTime()}>{t("计算", "Calculate")} →</button>''')
          path.write_text(text)

          css = Path('apps/web/src/visual-studios.css')
          styles = css.read_text()
          styles = styles.replace('.photo-stage img,\n.heic-preview img {', '.photo-stage img,\n.photo-stage canvas,\n.heic-preview img,\n.heic-preview canvas {')
          styles += '''\n.raster-preview-fallback {\n  min-height: 180px;\n  display: grid;\n  place-items: center;\n  border: 1px dashed var(--line);\n  border-radius: 12px;\n  color: var(--muted);\n  background: var(--panel2);\n  font-size: 10px;\n}\n'''
          css.write_text(styles)
          PY
          npm run lint
          npm run typecheck
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/VisualStudioWorkspace.tsx apps/web/src/visual-studios.css
          git commit -m "fix: harden raster previews and repair visual E2E [v010-final]"
          git push origin HEAD:feature/v0.10-visual-tool-studios
