name: Apply v0.10 lint cleanup

on:
  push:
    branches: [feature/v0.10-visual-tool-studios]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[v010-fix]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v0.10-visual-tool-studios
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Remove unused helper and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/VisualStudioWorkspace.tsx')
          text = path.read_text()
          block = '''function htmlEscape(value: string) {
            return value
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;");
          }

          '''
          if block not in text:
              raise SystemExit('expected helper block not found')
          path.write_text(text.replace(block, ''))
          PY
          npm run lint
          npm run typecheck
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/VisualStudioWorkspace.tsx
          git commit -m "fix: remove unused visual studio helper [v010-fix]"
          git push origin HEAD:feature/v0.10-visual-tool-studios
