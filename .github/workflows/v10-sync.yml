name: Sync v0.10 visual studio dependencies

on:
  push:
    branches: [feature/v0.10-visual-workbenches]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[v10-sync]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v0.10-visual-workbenches
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned browser engines
        run: |
          npm install --save-exact mermaid@11.17.2 https://cdn.sheetjs.com/xlsx-0.20.2/xlsx-0.20.2.tgz svgo@4.1.0 exifreader@4.51.0 heic2any@0.0.4 colorthief@3.5.0 cron-parser@5.10.2 @zxcvbn-ts/core@4.2.0 @zxcvbn-ts/language-common@4.1.3 @zxcvbn-ts/language-en@4.1.1 html2canvas@1.4.1 dayjs@1.11.23
          npm version 0.10.0 --no-git-tag-version --allow-same-version
      - name: Apply typed vendor compatibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/web/src/VisualStudioWorkspace.tsx")
          text = path.read_text()
          text = text.replace(
              '    // Initial render only; explicit button keeps large diagram rendering predictable.\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n',
              '    // Initial render only; explicit button keeps large diagram rendering predictable.\n',
          )
          text = text.replace(
              '  useEffect(() => { void optimizeSvg(); /* eslint-disable-next-line react-hooks/exhaustive-deps */ }, []);',
              '  useEffect(() => { void optimizeSvg(); }, []);',
          )
          text = text.replace(
              '        const palette = mod.getPaletteSync(image, { colorCount: 8 });\n        setColors(palette.map((color) => ({ hex: color.hex(), rgb: color.css(), text: color.textColor })));',
              '        const palette = mod.getPaletteSync(image, { colorCount: 8 });\n        if (!palette) throw Error(t("无法从图片提取配色", "Could not extract a palette from this image"));\n        setColors(palette.map((color) => ({ hex: color.hex(), rgb: color.css(), text: color.textColor })));',
          )
          marker = 'function blobUrl(blob: Blob | null) {'
          helper = '''function crackTime(seconds: number) {\n  if (!Number.isFinite(seconds) || seconds >= 60 * 60 * 24 * 365 * 100) return "centuries";\n  if (seconds < 1) return "less than a second";\n  const units: [number, string][] = [\n    [60 * 60 * 24 * 365, "year"],\n    [60 * 60 * 24, "day"],\n    [60 * 60, "hour"],\n    [60, "minute"],\n    [1, "second"],\n  ];\n  for (const [size, name] of units) {\n    if (seconds >= size) {\n      const value = Math.max(1, Math.round(seconds / size));\n      return `${value.toLocaleString()} ${name}${value === 1 ? "" : "s"}`;\n    }\n  }\n  return "less than a second";\n}\n\n'''
          if helper not in text:
              text = text.replace(marker, helper + marker)
          text = text.replace(
              'crack: data.crackTimesDisplay.offlineSlowHashing1e4PerSecond,',
              'crack: crackTime(data.guesses / 10_000),',
          )
          path.write_text(text)
          PY
      - name: Validate web implementation
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm audit --omit=dev --audit-level=moderate
      - name: Commit deterministic dependency and compatibility changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/web/src/VisualStudioWorkspace.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: sync v0.10 browser engines [v10-sync]"
          git push origin HEAD:feature/v0.10-visual-workbenches
