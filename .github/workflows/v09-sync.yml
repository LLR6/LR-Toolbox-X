name: Sync v0.9 dependencies

on:
  push:
    branches: [feature/v0.9-dashboard-personality]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[deps-sync]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v0.9-dashboard-personality
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned v0.9 dependencies
        run: |
          npm install --save-exact fuse.js@7.5.0 jsonrepair@3.15.0 turndown@7.2.4
          npm install --save-dev --save-exact @types/turndown@5.0.6
          npm version 0.9.0 --no-git-tag-version --allow-same-version
      - name: Generate executable catalog
        run: npm run catalog
      - name: Validate registry and TypeScript
        run: |
          npm test
          npm run typecheck
      - name: Commit deterministic dependency/catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json docs/actions.md apps/web/public/action-catalog.json apps/android/app/src/main/assets/action-catalog.json apps/android/app/src/main/java/io/github/llr6/lrx/NativeActionIds.kt apps/android/app/src/test/java/io/github/llr6/lrx/PortableConformanceTest.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: sync v0.9 dependencies and catalog [deps-sync]"
          git push origin HEAD:feature/v0.9-dashboard-personality
