name: Publish release assets
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Collect exact-commit successful builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/download-release-inputs.py
      - run: npm ci
      - run: npm run build
      - run: python scripts/prepare-release.py
      - run: python scripts/checksums.py release-assets
      - name: Attach verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
